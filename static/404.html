<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found &middot; MaLa Luminova Partners</title>
    <!--
      GitHub Pages serves this file for any unmatched path. The in-app
      not-found page lives under a locale and cannot cover locale-less URLs,
      so this is a deliberately dependency-free fallback: no font loading, no
      CSS bundle, nothing that could 404 on its own. Colors and type steps are
      DESIGN.md tokens, inlined by necessity.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: #FBFAF7; /* limestone */
        color: #10203F; /* ink-navy */
        font-family: 'Libre Franklin', system-ui, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      h1 {
        margin: 0;
        font-family: Cinzel, Georgia, serif;
        font-size: clamp(1.5rem, 2.8vw, 2.125rem);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .rule {
        width: 4rem;
        height: 1px;
        margin: 0 auto;
        background: #6E5A34; /* bronze */
      }
      p { margin: 0; color: #4A505E; /* slate */ }
      a { color: #10203F; text-underline-offset: 0.2em; }
      a:hover { color: #1A2C55; }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <div class="rule"></div>
    <p>The page you asked for does not exist.</p>
    <p><a href="/en/">Return to MaLa Luminova Partners</a></p>
  </body>
</html>
